server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA — все маршруты отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    location = /api {
        return 404;
    }

    # На бэкенд пропускаем только API, которые реально использует приложение.
    location ~ ^/api/(auth|users|education-levels|interests|regions|map|news|admin)(/|$) {
        proxy_pass http://applicants-service:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_request_buffering off;
        client_max_body_size 25m;
    }

    location /api/ {
        return 404;
    }

    # Статические ассеты — агрессивное кэширование
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
