services:
  interactive-map-db:
    image: postgres:15
    container_name: interactive-map-db
    environment:
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-interactive-map-db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SPRING_DATASOURCE_USERNAME:-postgres} -d ${POSTGRES_DB:-interactive-map-db}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  migrator:
    image: liquibase/liquibase:4.27
    container_name: interactive-map-migrator
    depends_on:
      interactive-map-db:
        condition: service_healthy
    volumes:
      - ../db:/liquibase/db:ro
    command: >
      --url=${SPRING_DATASOURCE_URL:-jdbc:postgresql://interactive-map-db:5432/interactive-map-db}
      --username=${SPRING_DATASOURCE_USERNAME:-postgres}
      --password=${SPRING_DATASOURCE_PASSWORD:-postgres}
      --search-path=/liquibase/db
      --changelog-file=db.changelog-master.xml
      update

  applicants-service:
    build:
      context: ../services/applicants-service
      dockerfile: Dockerfile
    container_name: interactive-map-applicants-service
    depends_on:
      interactive-map-db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: interactive-map-frontend
    depends_on:
      applicants-service:
        condition: service_started
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
