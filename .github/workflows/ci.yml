name: CI - applicants-service

on:
  push:
    branches:
      - main
    paths:
      - 'services/applicants-service/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'services/applicants-service/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/applicants-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x ./mvnw

      - name: Verify
        run: ./mvnw -B verify
